# Authors: Grok and Eldon R. Brown - WA0UWH
# Rev: 20261104f
# ERB_EspWebServer for ESP32-S3 Super Mini (HW-747 V0.0.2). Shared UI + entities in common/.
# Assumed chip ESP32-S3FH4R2: 4 MB flash, 2 MB QUAD PSRAM (in-package), native USB on the USB-C.
# Specs: espboards.dev/esp32/esp32-s3-super-mini, esp32.co.uk (SuperMini/HW-747), devices.esphome.io.
# Pins used are all on the side headers: IO4/IO5/IO6 LEDs, IO7 input (no strap/USB/flash pins).
# GPIO48 = onboard WS2812 (shared with a red LED on some boards) - left for the optional light below.

substitutions:
  Rev: "20261104f"
  Build_Name: ERB_EspWebServer_Esp32S3_SuperMini_Ws2812_20261104f   # must equal the bin base name
  Device_Name: erb-espwebserver-s3
  Friendly_Name: ERB EspWebServer S3
  Red_Pin: GPIO4
  Grn_Pin: GPIO5
  Blu_Pin: GPIO6
  Hb_Target: Blu_LED   # heartbeat drives the Blue LED
  In_Pin: GPIO7

packages:
  common: !include common/ERB_Common.yaml
  leds: !include common/ERB_Leds_Rgb.yaml
  heartbeat: !include common/ERB_Heartbeat.yaml
  boot_slot: !include common/ERB_BootSlot.yaml


# Firmware upload from the device's own page (Admin tab, POST /update), no USB needed.
# No web login right now, so anyone on the LAN could upload firmware (see auth note in common/).
ota:
  - platform: web_server

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

# Logs over the native USB-C port (S3 built-in USB Serial/JTAG CDC, no UART chip on this board)
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# Lets web.esphome.io send WiFi credentials over USB right after flashing
# (so secrets.yaml WiFi values can stay dummy). Uses the logger's USB_SERIAL_JTAG port.
improv_serial:

# PSRAM: confirmed by boot log 20261104 (QFN56 rev v0.2, 4MB XMC flash, 2MB quad PSRAM AP_3v3).
# QUAD mode only - octal will fail to boot on R2 parts.
psram:
  mode: quad
  speed: 80MHz

# No ADC VCC on ESP32: chip temperature instead of Vdd
sensor:
  - platform: internal_temperature
    name: "Chip Temp"
    update_interval: 30s
  - platform: debug
    psram:
      name: "PSRAM Free"

# Onboard WS2812 RGB LED on GPIO48 (internal: hidden from the web UI).
# If your board has a plain LED on GPIO48 instead, use ..._PlainLed48.yaml.
light:
  - platform: esp32_rmt_led_strip
    id: Onboard_Rgb
    internal: true
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    default_transition_length: 0s   # needed for the 80 ms heartbeat blinks
    restore_mode: ALWAYS_OFF

# Mirror the Blue LED (IO6) onto the onboard WS2812. Same id as in common/, so ESPHome
# merges these triggers into that switch. The heartbeat (and the manual Blue LED button)
# therefore light the WS2812 blue; Heartbeat OFF turns Blue LED, and so the WS2812, off.
switch:
  - id: !extend Blu_LED
    on_turn_on:
      - light.turn_on: { id: Onboard_Rgb, red: 0%, green: 0%, blue: 100%, brightness: 40% }
    on_turn_off:
      - light.turn_off: Onboard_Rgb

# End
