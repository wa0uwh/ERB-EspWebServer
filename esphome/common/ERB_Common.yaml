# Authors: Grok and Eldon R. Brown - WA0UWH
# Rev: 20261104i
# ERB_Common - shared, board-independent part of the standalone ESPHome port of
# github.com/wa0uwh/ERB-EspWebServer. No Home Assistant (no api: block).
# LEDs and heartbeat live in ERB_Leds_Rgb.yaml / ERB_Heartbeat.yaml (per-board packages).
# Board files supply: Rev, Build_Name (= the bin base name), Device_Name, Friendly_Name, Red_Pin, Grn_Pin, Blu_Pin, In_Pin,
# plus their own esp8266:/esp32: block and board-only sensors (Vdd or Chip Temp/PSRAM).

esphome:
  name: ${Device_Name}
  friendly_name: ${Friendly_Name}
  # 20261104m: comment = Build_Name; web_server sends it in the /events "ping" config (get_config_json),
  # so the page can show the firmware name even before the Build Name text_sensor arrives.
  comment: "${Build_Name}"
  # 20261104m: publish Build Name/Time at boot (template text_sensors do NOT update in setup()).
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(Build_Name_Text).publish_state("${Build_Name}");
          char buf[esphome::Application::BUILD_TIME_STR_SIZE];
          App.get_build_time_string(buf);
          id(Build_Time_Text).publish_state(buf);
  project:
    name: wa0uwh.erb_espwebserver
    version: "${Rev}"

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ERB-EspWebServer-Setup"
    password: !secret fallback_ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

mdns:

# Custom ERB UI, served from flash. js_url "" stops the stock page loading
# its app from oi.esphome.io, so the device needs no internet at all.
web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: "www/erb_ui.js"   # relative to the board file
  # Web login is OFF for now (Eldon, 20261104d). To re-enable later, uncomment and set
  # web_password in secrets.yaml; it then covers the page, /events, REST POSTs and /update.
  # auth:
  #   username: guest
  #   password: !secret web_password

debug:
  update_interval: 10s

time:
  - platform: sntp
    id: Sntp_Time
    timezone: "PST8PDT,M3.2.0,M11.1.0"   # America/Los_Angeles (POSIX)

sensor:
  - platform: wifi_signal
    id: Wifi_Rssi
    name: "WiFi Signal"
    update_interval: 30s
  - platform: uptime
    id: Uptime_Sec
    name: "Uptime"
    update_interval: 10s
  - platform: debug
    free:
      id: Free_Heap
      name: "Free Heap"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    bssid:
      name: "Connected BSSID"
    mac_address:
      name: "MAC Address"
    scan_results:
      name: "WiFi Scan"
  # Which firmware is loaded: Build_Name equals the bin base name, e.g.
  # ERB_EspWebServer_Esp32S3_SuperMini_PlainLed48_20261104f (.factory.bin / .ota.bin)
  - platform: template
    id: Build_Name_Text
    name: "Build Name"
    icon: mdi:package-variant
    update_interval: 60s   # 20261104m: was 'never' -> state stayed empty, page showed '--'
    lambda: 'return {"${Build_Name}"};'
  # Compile date/time from the build host (box clock is Pacific), e.g. 2026-11-04 17:55:00 -0800
  - platform: template
    id: Build_Time_Text
    name: "Build Time"
    icon: mdi:clock-check-outline
    update_interval: 60s   # 20261104m: was 'never'
    lambda: |-
      char buf[esphome::Application::BUILD_TIME_STR_SIZE];
      App.get_build_time_string(buf);
      return {buf};
  - platform: template
    id: Clock_Text
    name: "Clock"
    icon: mdi:clock-outline
    update_interval: 1s
    lambda: |-
      auto t = id(Sntp_Time).now();
      if (!t.is_valid()) return {"--:--:--"};
      return t.strftime("%Y-%m-%d %H:%M:%S %Z");

binary_sensor:
  - platform: status
    name: "Status"
  - platform: gpio
    id: Input_1
    name: "Input 1"
    pin: { number: "${In_Pin}", mode: INPUT_PULLUP, inverted: true }

button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Restart (Safe Mode)"

# End
