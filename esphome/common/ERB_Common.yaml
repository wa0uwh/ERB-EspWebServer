# Authors: Grok and Eldon R. Brown - WA0UWH
# Rev: 20261104c
# ERB_Common - shared, board-independent part of the standalone ESPHome port of
# github.com/wa0uwh/ERB-EspWebServer. No Home Assistant (no api: block).
# Board files supply: Device_Name, Friendly_Name, Red_Pin, Grn_Pin, Blu_Pin, In_Pin,
# plus their own esp8266:/esp32: block and board-only sensors (Vdd or Chip Temp/PSRAM).

esphome:
  name: ${Device_Name}
  friendly_name: ${Friendly_Name}
  project:
    name: wa0uwh.erb_espwebserver
    version: "20261104c"

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ERB-EspWebServer-Setup"
    password: !secret fallback_ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

mdns:

# Custom ERB UI, served from flash. js_url "" stops the stock page loading
# its app from oi.esphome.io, so the device needs no internet at all.
web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: "www/erb_ui.js"   # relative to the board file
  # Basic auth (example project): user guest, password grest (secrets.yaml web_password).
  # Covers the page, /events, REST POSTs and the S3 /update upload.
  auth:
    username: guest
    password: !secret web_password

debug:
  update_interval: 10s

time:
  - platform: sntp
    id: Sntp_Time
    timezone: "PST8PDT,M3.2.0,M11.1.0"   # America/Los_Angeles (POSIX)

sensor:
  - platform: wifi_signal
    id: Wifi_Rssi
    name: "WiFi Signal"
    update_interval: 30s
  - platform: uptime
    id: Uptime_Sec
    name: "Uptime"
    update_interval: 10s
  - platform: debug
    free:
      id: Free_Heap
      name: "Free Heap"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    bssid:
      name: "Connected BSSID"
    mac_address:
      name: "MAC Address"
    scan_results:
      name: "WiFi Scan"
  - platform: template
    id: Clock_Text
    name: "Clock"
    icon: mdi:clock-outline
    update_interval: 1s
    lambda: |-
      auto t = id(Sntp_Time).now();
      if (!t.is_valid()) return {"--:--:--"};
      return t.strftime("%Y-%m-%d %H:%M:%S %Z");

# LEDs are active-low (original: ON = 0, LED wired to 3.3V)
switch:
  - platform: gpio
    id: Red_LED
    name: "Red LED"
    pin: { number: "${Red_Pin}", inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: Grn_LED
    name: "Green LED"
    pin: { number: "${Grn_Pin}", inverted: true }
  - platform: gpio
    id: Blu_LED
    name: "Blue LED"
    pin: { number: "${Blu_Pin}", inverted: true }

  # Heartbeat: while ON, the interval below drives the Blue LED with a
  # double-blink. Turning it OFF leaves the Blue LED off and back under manual control.
  - platform: template
    id: Heartbeat
    name: "Heartbeat"
    icon: mdi:heart-pulse
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - switch.turn_off: Blu_LED

# Heartbeat on the Blue LED (Eldon's pattern), one 2 s cycle per interval tick:
#   WiFi NOT connected: slow blink, 1 s on / 1 s off
#   WiFi connected:     80 ms on, 80 ms off, 80 ms on, then off for the rest of the 2 s
# wifi.connected is checked every cycle, so the pattern follows WiFi drops and reconnects.
interval:
  - interval: 2000ms
    then:
      - if:
          condition:
            switch.is_on: Heartbeat
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - switch.turn_on: Blu_LED
                  - delay: 80ms
                  - switch.turn_off: Blu_LED
                  - delay: 80ms
                  - switch.turn_on: Blu_LED
                  - delay: 80ms
                  - switch.turn_off: Blu_LED
                else:
                  - switch.turn_on: Blu_LED
                  - delay: 1000ms
                  - switch.turn_off: Blu_LED

binary_sensor:
  - platform: status
    name: "Status"
  - platform: gpio
    id: Input_1
    name: "Input 1"
    pin: { number: "${In_Pin}", mode: INPUT_PULLUP, inverted: true }

button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Restart (Safe Mode)"

# End
